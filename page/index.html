<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>双语桥接</title>
  <link rel="stylesheet" href="style.css">
  <script src="_magpie/bridge.js"></script>
  <script src="bundle.js" defer></script>
</head>
<body>
  <main>
    <header class="intro">
      <h1>双语桥接</h1>
      <p class="hint">中文输入转为英文，模型回复译回中文。仅翻译自然语言，图片和代码透传。</p>
    </header>

    <form id="settings">
      <section class="card">
        <h2>工作模型</h2>
        <p class="hint">实际回答问题、执行任务的模型。</p>
        <div class="grid">
          <label>供应商 <select id="provider" name="provider" required disabled><option value="">正在加载供应商…</option></select></label>
          <label>模型 ID <input id="model" name="model" required autocomplete="off" spellcheck="false" placeholder="gpt-6-sol" aria-describedby="model-help"></label>
        </div>
        <p id="model-help" class="hint">模型 ID 从 MAGPIE 模型目录复制，不含供应商前缀。</p>
        <p id="route-preview" class="preview"></p>
      </section>

      <section class="card">
        <h2>翻译服务</h2>
        <p class="hint">负责中英互译。切换服务后，请在供应商登录处更新对应的 API Key。</p>
        <div class="grid">
          <label>接口地址 <input id="base-url" name="baseURL" type="url" required autocomplete="off" spellcheck="false" placeholder="https://api.deepseek.com"></label>
          <label>翻译模型 <input id="translator-model" name="translatorModel" required autocomplete="off" spellcheck="false" placeholder="deepseek-flash"></label>
        </div>
        <p class="hint">接口需兼容 OpenAI Chat Completions。所选文本会发送给该服务；API Key 在「供应商 → 双语桥接」中管理。</p>
      </section>

      <section class="card">
        <h2>翻译</h2>
        <div class="switches">
          <label><input id="enabled" type="checkbox"><span><strong>启用翻译</strong><small>关闭时仍转发到所选工作模型。</small></span></label>
        </div>
        <details>
          <summary>更多设置</summary>
          <label class="alias-field">模型别名 <input id="alias" name="alias" required pattern="[A-Za-z0-9][A-Za-z0-9_.-]*" autocomplete="off" placeholder="coding"><small>客户端选择 bilingual/别名。修改别名会保留原有映射。</small></label>
          <div class="switches">
            <label><input id="input-translation" type="checkbox"><span>输入译为英文</span></label>
            <label><input id="output-translation" type="checkbox"><span>回复译为中文</span></label>
          </div>
          <p class="hint">输入翻译失败时停止请求；回复翻译失败时默认显示原文并提示。</p>
        </details>
      </section>

      <footer><span id="status" role="status" aria-live="polite">正在加载设置…若长时间未完成，请重新加载插件。</span><button id="save" type="submit" disabled>保存设置</button></footer>
    </form>
  </main>
</body>
</html>
